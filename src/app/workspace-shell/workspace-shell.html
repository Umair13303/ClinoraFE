<div class="desk-shell">
  <aside class="desk-nav">
    <div class="desk-brand">
      <span class="desk-mark">C</span>
      <div>
        <strong>Clinora</strong>
        <small>Diagnostics desk</small>
      </div>
    </div>

    @if (branches().length > 0) {
      <div class="mb-3">
        <p class="desk-nav-label">Branch</p>
        <p-select
          [options]="branches()"
          optionLabel="name"
          optionValue="id"
          [(ngModel)]="selectedBranchId"
          (ngModelChange)="onBranchChange($event)"
          size="small"
          styleClass="w-full desk-branch-select"
        />
      </div>
    }

    <p class="desk-nav-label">Workspace</p>
    @for (item of nav(); track item.path) {
      <a class="desk-nav-item" [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
    }
    <button type="button" class="desk-signout" (click)="signOut()">Sign out</button>
  </aside>
  <div class="desk-outlet">
    <router-outlet />
  </div>
</div>
