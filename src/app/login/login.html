<section
  class="grid min-h-dvh place-items-center p-6 text-[#0f172a]"
  style="
    background:
      radial-gradient(1100px 480px at 12% -8%, rgba(31, 127, 116, 0.16), transparent 58%),
      radial-gradient(900px 420px at 100% 0%, rgba(28, 25, 23, 0.08), transparent 55%),
      linear-gradient(180deg, #dce5ec 0%, #e8eef2 48%, #f1f5f8 100%);
  "
>
  <div class="grid w-full max-w-md gap-7">
    <div class="text-center">
      <div
        class="mx-auto mb-3 grid h-12 w-12 place-items-center rounded-[14px] text-lg font-bold text-white shadow-[0_12px_28px_rgba(31,127,116,0.3)]"
        style="background: linear-gradient(145deg, #2dd4bf 0%, #0f766e 48%, #115e59 100%)"
      >
        C
      </div>
      <h1 class="font-display m-0 text-[2.5rem] font-semibold tracking-tight">Clinora</h1>
      <p class="mt-2 text-sm text-[#64748b]">Diagnostics and hospital front desk</p>
    </div>

    <form
      class="grid gap-3.5 rounded-[18px] border border-[#d5dee6] bg-[linear-gradient(180deg,#ffffff_0%,#fff_100%)] p-6 shadow-[0_1px_0_rgba(255,255,255,0.85)_inset,0_18px_40px_rgba(28,25,23,0.06)]"
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <header class="mb-1">
        <h2 class="m-0 text-lg font-semibold tracking-tight">Sign in</h2>
        <p class="mt-1.5 text-sm text-[#64748b]">Use your desk account to open the visit workflow.</p>
      </header>

      <label class="grid gap-1.5 text-[12px] font-semibold text-[#475569]">
        Email
        <input pInputText type="email" formControlName="email" autocomplete="username" fluid />
      </label>

      <label class="grid gap-1.5 text-[12px] font-semibold text-[#475569]">
        Password
        <input pInputText type="password" formControlName="password" autocomplete="current-password" fluid />
      </label>

      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full" />
      }

      <p-button type="submit" [label]="submitting() ? 'Signing in…' : 'Sign in'" [loading]="submitting()" styleClass="mt-1 w-full!" />
    </form>
  </div>
</section>
