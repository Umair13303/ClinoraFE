<section class="login">
  <div class="login__atmosphere" aria-hidden="true">
    <svg class="login__ecg" viewBox="0 0 1200 280" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="ecgGlow" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#fb7185" stop-opacity="0.15" />
          <stop offset="45%" stop-color="#fb7185" stop-opacity="1" />
          <stop offset="100%" stop-color="#fb7185" stop-opacity="0.2" />
        </linearGradient>
        <filter id="ecgBlur" x="-20%" y="-80%" width="140%" height="260%">
          <feGaussianBlur stdDeviation="2.4" />
        </filter>
      </defs>
      <!-- echo traces -->
      <path
        class="login__ecg-echo login__ecg-echo--top"
        d="M0 110 H180 L210 110 L230 40 L255 180 L280 110 H480 L510 110 L530 40 L555 180 L580 110 H780 L810 110 L830 40 L855 180 L880 110 H1080 L1110 110 L1130 40 L1155 180 L1180 110 H1200"
        fill="none"
      />
      <path
        class="login__ecg-echo login__ecg-echo--bot"
        d="M0 170 H180 L210 170 L230 100 L255 240 L280 170 H480 L510 170 L530 100 L555 240 L580 170 H780 L810 170 L830 100 L855 240 L880 170 H1080 L1110 170 L1130 100 L1155 240 L1180 170 H1200"
        fill="none"
      />
      <!-- main waveform -->
      <path
        class="login__ecg-main login__ecg-main--glow"
        d="M0 140 H180 L210 140 L230 55 L255 225 L280 140 H480 L510 140 L530 55 L555 225 L580 140 H780 L810 140 L830 55 L855 225 L880 140 H1080 L1110 140 L1130 55 L1155 225 L1180 140 H1200"
        fill="none"
        filter="url(#ecgBlur)"
      />
      <path
        class="login__ecg-main"
        d="M0 140 H180 L210 140 L230 55 L255 225 L280 140 H480 L510 140 L530 55 L555 225 L580 140 H780 L810 140 L830 55 L855 225 L880 140 H1080 L1110 140 L1130 55 L1155 225 L1180 140 H1200"
        fill="none"
        stroke="url(#ecgGlow)"
      />
    </svg>
  </div>

  <div class="login__panel">
    <div class="login__brand">
      <div class="login__mark">C</div>
      <h1>Clinora</h1>
      <p>Diagnostics and hospital front desk</p>
    </div>

    <form class="login__form" [formGroup]="form" (ngSubmit)="submit()">
      <header>
        <h2>Sign in</h2>
        <p>Use your desk account to open the visit workflow.</p>
      </header>

      <label>
        Email
        <input pInputText type="email" formControlName="email" autocomplete="username" fluid />
      </label>

      <label>
        Password
        <input pInputText type="password" formControlName="password" autocomplete="current-password" fluid />
      </label>

      @if (error()) {
        <p-message severity="error" [text]="error()" styleClass="w-full" />
      }

      <p-button
        type="submit"
        [label]="submitting() ? 'Signing in…' : 'Sign in'"
        [loading]="submitting()"
        styleClass="mt-1 w-full!"
      />
    </form>
  </div>
</section>
